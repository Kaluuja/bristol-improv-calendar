name: Export Approved Events

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: export-events
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Export events from Airtable
        id: export
        run: node scripts/export-events.mjs
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add events.json events.ics
          git diff --staged --quiet || git commit -m "Update events - $(date -u +'%Y-%m-%d %H:%M')"
          git push

      # Runs after publishing, so a dead sync still gets today's export out,
      # then fails the run so GitHub emails.
      - name: Check the Dockhead sync is still running
        if: steps.export.outputs.sync_stale == 'true'
        run: |
          echo "::error::No sync in Airtable for 3+ days. Check Dockhead: cron, Docker, /home/ste/improv-calendar-sync.log"
          exit 1
