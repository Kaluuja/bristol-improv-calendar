name: Sync Events to Airtable

# Scrapes venue/aggregator sites (sync/) and upserts improv events into
# Airtable as Pending. Approval happens in Telegram via n8n; the separate
# export-events workflow then publishes Approved events to the site.

on:
  # Manual fallback only. The scheduled sync runs daily on Dockhead
  # (sync/dockhead/), because several venues block GitHub's servers.
  # Don't re-add a schedule here without turning Dockhead's off: two syncs
  # at once can create duplicate Airtable records.
  workflow_dispatch:

concurrency:
  group: sync-events
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sync/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Run sync
        run: npm run sync -- --verbose
        env:
          # Adapters build venue times with local-time Date constructors;
          # must be Bristol time or BST events are stored an hour late.
          TZ: Europe/London
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
